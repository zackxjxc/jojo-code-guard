# 跨平台回归验证：检查 Python、Bash、Git diff 和编码守护行为。
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
        # actions/setup-python 没有 Windows 3.9.20+ 构建；旧补丁版不能安全创建
        # owner-only 事务私有目录，因此 Windows 仅验证受支持的 3.13。
        exclude:
          - os: windows-latest
            python-version: "3.9"
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python scripts
        run: python -m compileall -q scripts hooks skills/jojo-code-guard/scripts

      - name: Check Git whitespace
        shell: bash
        env:
          JOJO_EVENT_NAME: ${{ github.event_name }}
          JOJO_BEFORE_SHA: ${{ github.event.before }}
          JOJO_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$JOJO_EVENT_NAME" = "pull_request" ] \
              && git cat-file -e "${JOJO_PR_BASE_SHA}^{commit}" 2>/dev/null; then
            diff_base="$(git merge-base "$JOJO_PR_BASE_SHA" HEAD)"
          elif [ "$JOJO_EVENT_NAME" = "push" ] \
              && [ -n "$JOJO_BEFORE_SHA" ] \
              && [ "$JOJO_BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "${JOJO_BEFORE_SHA}^{commit}" 2>/dev/null; then
            diff_base="$JOJO_BEFORE_SHA"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            diff_base="$(git rev-parse HEAD^)"
          else
            diff_base="$(git hash-object -t tree /dev/null)"
          fi
          git diff --check "$diff_base" HEAD

      - name: Run repository guard
        run: python skills/jojo-code-guard/scripts/check_diff.py --repo . --tracked-revision HEAD
